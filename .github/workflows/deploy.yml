name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The page of each language (/sv/, /es/ ...) and sitemap.xml.
      - run: node tools/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tells Bing and the other IndexNow search engines which pages there are, so that changes are
      # read soon. The key is public: it is the name and the content of a file at the top of the site.
      - name: IndexNow
        continue-on-error: true
        run: |
          urls=$(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' | sed 's/.*/"&"/' | paste -sd, -)
          curl -sS -m 30 -o /dev/null -w '%{http_code}\n' -H 'Content-Type: application/json; charset=utf-8'             -d "{\"host\":\"letteradventures.com\",\"key\":\"494f58756f192585731a20fdab7f0f7e\",\"keyLocation\":\"https://letteradventures.com/494f58756f192585731a20fdab7f0f7e.txt\",\"urlList\":[$urls]}"             https://api.indexnow.org/indexnow
